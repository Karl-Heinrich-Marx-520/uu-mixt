<!DOCTYPE html>
<html lang="zh-CN" data-mode="dark" data-default-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 写作台 · UU&amp;Mixt</title>
  <meta name="description" content="UU&Mixt 写作台登录：两位作者各用一个密码，验证通过后进入各自的写作台。">
  <link rel="stylesheet" href="assets/demo.css?v=4">
  <!-- 登录页默认暗色（data-default-mode），但仍可手动切换 -->
</head>
<body data-face="shared" data-page="admin">

  <a class="skip-link" href="#main">跳到正文</a>

  <div class="page-card">

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" title="回到入口页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12a8 8 0 0 1 13-6.2M20 12a8 8 0 0 1-13 6.2"/>
            <path d="M17 3v3.5h-3.5M7 21v-3.5h3.5"/>
          </svg>
        </span>
        UU<span class="amp">&amp;</span>Mixt <span class="admin-badge">写作台</span>
      </a>
      <nav class="nav" aria-label="站点级导航">
        <a href="index.html">入口页</a>
        <a href="uu.html">UU 的一面</a>
        <a href="mixt.html">Mixt 的一面</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" data-action="toggle-mode" aria-label="切换明暗模式" title="切换明暗模式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page admin-shell login-page" id="main">
    <section class="login-wrap">
      <form class="login-card" data-login-form>
        <h1>登录写作台</h1>
        <p class="sub">两位作者各有自己的密码。验证通过后会进入你自己的写作台页面。</p>
        <label for="login-pass">密码</label>
        <input id="login-pass" type="password" autocomplete="current-password" placeholder="请输入你的写作台密码">
        <button class="login-btn" type="submit">进入写作台</button>
        <p class="login-error" data-login-error role="alert"></p>
        <div class="login-hint">
          <b>Demo 密码</b><br>
          UU 面：<code>uu2026</code> &nbsp;·&nbsp; Mixt 面：<code>mixt2026</code><br>
          正式实现为 Decap CMS + GitHub OAuth（每人只授权自己那一面的目录），本页仅为交互原型。
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">UU<span class="amp">&amp;</span>Mixt</div>
      <nav class="footer-links" aria-label="站点级链接">
        <a href="about.html">关于本站</a>
        <span class="sep">·</span>
        <a href="index.html">回到入口页</a>
      </nav>
      <p class="icp"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">湘ICP备XXXXXXXX号-1（备案审核中，上线后展示正式备案号）</a></p>
      <p>UU&amp;Mixt 写作台登录 · Demo 版</p>
    </div>
  </footer>

  </div><!-- /.page-card -->

  <script src="assets/demo-store.js?v=4"></script>
  <script src="assets/demo.js?v=4"></script>
  <script>
    /* 登录页：校验密码 → 记住身份 → 跳转到独立的写作台页面 */
    (function () {
      "use strict";
      var PASSWORDS = { uu: "uu2026", mixt: "mixt2026" };
      var SESSION = "uum-demo-session";
      var form = document.querySelector("[data-login-form]");
      var input = document.getElementById("login-pass");
      var errBox = document.querySelector("[data-login-error]");

      /* 已登录则直接进写作台 */
      try {
        var saved = localStorage.getItem(SESSION);
        if (saved && PASSWORDS[saved]) { location.replace("admin-desk.html"); return; }
      } catch (e) {}

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var v = input.value.trim();
        var hit = Object.keys(PASSWORDS).filter(function (k) { return PASSWORDS[k] === v; });
        if (!hit.length) {
          errBox.textContent = "密码不正确。Demo 密码：UU 面 uu2026 · Mixt 面 mixt2026";
          input.select();
          return;
        }
        try { localStorage.setItem(SESSION, hit[0]); } catch (e) {}
        location.href = "admin-desk.html?face=" + hit[0];
      });
    })();
  </script>
</body>
</html>
