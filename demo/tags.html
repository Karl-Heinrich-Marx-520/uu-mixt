  <main class="page" id="main">
    <h1 style="font-size:1.5rem;margin:6px 0 10px">标签</h1>
    <p class="search-meta" style="margin-bottom:20px">
      标签是<strong>两面共享</strong>的：同一个标签会同时收纳 UU 与 Mixt 面用到它的文章，每条结果都标识作者。
      分类则是各面独立的。
    </p>

    <div class="tag-cloud" data-tag-cloud></div>
    <div data-tag-blocks></div>
  </main>

  <script src="assets/demo-store.js?v=5"></script>
  <script src="assets/demo.js?v=5"></script>
  <script>
    /* 标签页：共享标签池 + 每个标签下的两面文章 */
    (function () {
      "use strict";
      var store = window.UUMStore;
      var FACES = { uu: { name: "UU" }, mixt: { name: "Mixt" } };
      var cloud = document.querySelector("[data-tag-cloud]");
      var blocks = document.querySelector("[data-tag-blocks]");

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function slugOf(t) {
        return String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "tag";
      }

      /* 收集：标签 → { 两面文章 } */
      var map = {};
      Object.keys(FACES).forEach(function (f) {
        store.published(f).forEach(function (p) {
          (p.tags || []).forEach(function (t) {
            var s = slugOf(t);
            if (!map[s]) map[s] = { name: t, slug: s, posts: [] };
            map[s].posts.push({ face: f, post: p });
          });
        });
      });
      var tags = Object.keys(map).map(function (k) { return map[k]; })
        .sort(function (a, b) { return b.posts.length - a.posts.length || a.name.localeCompare(b.name); });

      if (!tags.length) {
        cloud.innerHTML = "";
        blocks.innerHTML = '<div class="empty-state"><h2>还没有任何标签</h2>' +
          '<p>在写作台新建文章时填上标签，这里会自动出现。</p></div>';
        return;
      }

      cloud.innerHTML = tags.map(function (t) {
        return '<a href="#tag-' + esc(t.slug) + '">' + esc(t.name) + " <b>" + t.posts.length + "</b></a>";
      }).join("");

      blocks.innerHTML = tags.map(function (t) {
        var uu = t.posts.filter(function (x) { return x.face === "uu"; }).length;
        var mx = t.posts.filter(function (x) { return x.face === "mixt"; }).length;
        var rows = t.posts
          .sort(function (a, b) { return (b.post.date || "").localeCompare(a.post.date || ""); })
          .map(function (x) {
            var p = x.post;
            var href = p.detail || ("post.html?face=" + x.face + "&slug=" + encodeURIComponent(p.slug));
            return '<li class="archive-row"><time datetime="' + esc(p.date) + '">' + esc((p.date || "").slice(5)) + "</time>" +
              '<a href="' + href + '">' + esc(p.title) + "</a>" +
              '<span class="result-author" data-face="' + x.face + '">' + FACES[x.face].name + "</span></li>";
          }).join("");
        return '<div class="tag-block" id="tag-' + esc(t.slug) + '">' +
          "<h2>" + esc(t.name) + " <small>共 " + t.posts.length + " 篇 · UU " + uu + " / Mixt " + mx + "</small></h2>" +
          '<ul class="archive-list">' + rows + "</ul></div>";
      }).join("");
    })();
  </script>
</body>
