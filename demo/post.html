<body data-face="uu" class="article-page">

      <div class="header-actions">
        <a class="icon-btn" href="search.html" aria-label="全站搜索" title="全站搜索：一次搜索覆盖两面">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </a>
        <button class="icon-btn" data-action="toggle-mode" aria-label="切换明暗模式" title="切换明暗模式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="flip-btn" data-action="flip" title="翻到另一面（Alt + ←/→）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

          <span class="flip-text" data-flip-text>翻到另一面</span>

      </div>
    </div>

  <main class="page" id="main">
    <div class="article-layout">
      <article>
        <header class="article-header">
          <span class="chip chip--cat" data-post-cat>—</span>
          <h1 data-post-title>加载中…</h1>
          <div class="article-meta">

            <span class="dot" aria-hidden="true">|</span>
            <time data-post-date datetime="">—</time>
            <span class="dot" aria-hidden="true">|</span>
            <span data-post-len>—</span>
          </div>
        </header>

        <div class="notice notice--warn" data-compliance hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
          <span><strong>合规声明：</strong>本文仅用于安全研究与防御，全部实验在自建环境完成；代码为伪代码或已打码，不包含可直接复用的完整利用程序（PRD 3.7）。</span>
        </div>

        <div class="prose" data-post-body>
          <p>正在从内容层读取正文…</p>
        </div>

        <nav class="post-nav" data-post-nav aria-label="上一篇与下一篇"></nav>
      </article>

      <aside class="toc" data-post-toc hidden>
        <div class="toc-title">目录</div>

    </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">UU<span class="amp">&amp;</span>Mixt</div>
      <nav class="footer-links" aria-label="站点级链接">
        <a href="search.html">全站搜索</a>
        <span class="sep">·</span>
        <a href="tags.html">标签</a>
        <span class="sep">·</span>
        <a href="about.html">关于本站</a>
        <span class="sep">·</span>
        <a href="admin.html">写作台</a>
      </nav>
      <p class="icp"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">湘ICP备XXXXXXXX号-1（备案审核中，上线后展示正式备案号）</a></p>
      <p data-footer-face>UU&amp;Mixt · Demo 版</p>
    </div>
  </footer>

  </div><!-- /.page-card -->

  <button class="back-top" data-action="back-top" aria-label="回到顶部" title="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <script src="assets/demo-md.js?v=7"></script>
  <script src="assets/demo-store.js?v=7"></script>
  <script src="assets/demo.js?v=7"></script>
  <script>
    /* 文章详情页：按 ?face=&slug= 从内容层取文章并渲染（正文为 Markdown） */
    (function () {
      "use strict";
      var store = window.UUMStore;
      var $ = function (s) { return document.querySelector(s); };
      var FACE = {
        uu: { name: "UU", avatar: "assets/uu.jpg", other: "mixt", otherName: "Mixt",
              home: "uu.html", archive: "uu-archive.html", category: "uu-category.html", about: "uu-about.html" },
        mixt: { name: "Mixt", avatar: "assets/mixt.jpg", other: "uu", otherName: "UU",
                home: "mixt.html", archive: "mixt-archive.html", category: "mixt-category.html", about: "mixt-about.html" }
      };

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      /* ---------- 取文章 ---------- */
      var qs = new URLSearchParams(location.search);
      var face = qs.get("face") || "uu";
      var slug = qs.get("slug");
      if (!FACE[face]) face = "uu";

      var post = null;
      if (slug) {
        post = store.allPosts(face).filter(function (p) { return p.slug === slug; })[0] || null;
        if (!post) {                       /* 未指定面时跨面找 */
          ["uu", "mixt"].some(function (f) {
            var hit = store.allPosts(f).filter(function (p) { return p.slug === slug; })[0];
            if (hit) { post = hit; face = f; return true; }
            return false;
          });
        }
      }
      var meta = FACE[face];

      /* ---------- 页面骨架按面适配 ---------- */
      var body = document.body;
      body.dataset.face = face;
      body.dataset.flipTo = meta.other + ".html";
      document.title = (post ? post.title + " · " : "") + meta.name + " 的文章 · UU&Mixt";
      $("[data-flip-text]").textContent = "翻到 " + meta.otherName;
      $("[data-footer-face]").textContent = meta.name + " 的一面 · Demo 版";
      $("[data-face-nav]").innerHTML =
        '<a href="' + meta.home + '">首页</a>' +
        '<a href="' + meta.archive + '">归档</a>' +
        '<a href="' + meta.category + '">分类</a>' +
        '<a href="' + meta.about + '">关于</a>';
      $(".flip-btn").title = "翻到 " + meta.otherName + " 的一面（Alt + ←/→）";
      if (face === "mixt") $("[data-compliance]").hidden = false;

      /* ---------- 找不到文章 ---------- */
      if (!post) {
        $("[data-post-cat]").hidden = true;
        $("[data-post-title]").textContent = "没有找到这篇文章";
        $("[data-post-body]").innerHTML = '<div class="empty-state"><h2>文章不存在</h2>' +
          '<p>可能是链接里的 slug 不对，或者这篇文章已被删除。回到面首页看看现有的文章。</p>' +
          '<p><a class="author-cta" href="' + meta.home + '">回到 ' + meta.name + " 的一面</a></p></div>";
        $("[data-post-avatar]").src = meta.avatar;
        $("[data-post-author]").textContent = meta.name;
        $("[data-post-date]").textContent = "—";
        $("[data-post-len]").textContent = "";
        return;
      }

      /* ---------- 渲染头部 ---------- */
      $("[data-post-cat]").textContent = post.category || "未分类";
      $("[data-post-cat]").className = "chip chip--cat";
      $("[data-post-title]").textContent = post.title;
      $("[data-post-avatar]").src = meta.avatar;
      $("[data-post-author]").textContent = meta.name;
      $("[data-post-date]").textContent = post.date;
      $("[data-post-date]").setAttribute("datetime", post.date);
      $("[data-post-len]").textContent = (post.words || "—") + " 字 · 约 " + (post.minutes || 5) + " 分钟";
      if (!post.category) $("[data-post-cat]").hidden = true;

      /* ---------- 渲染正文 ---------- */
      var bodyHost = $("[data-post-body]");
      if (post.body && post.body.trim()) {
        bodyHost.innerHTML = window.UUMMD.render(post.body);
      } else {
        bodyHost.innerHTML = '<div class="notice notice--info">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 12v4"/></svg>' +
          "<span>这篇是 Demo 的种子数据，没有配正文。在写作台新建一篇文章并填入正文，再用卡片点进来就能看到 Markdown 渲染与目录。" +
          (face === "uu" ? ' 也可以看<a href="uu-post.html">这篇精修示例</a>。' : ' 也可以看<a href="mixt-post.html">这篇精修示例</a>。') +
          "</span></div>";
      }
      if (!post.desc) { /* 无摘要时不渲染额外块 */ } else {
        var lede = document.createElement("p");
        lede.className = "post-lede";
        lede.textContent = post.desc;
        bodyHost.insertBefore(lede, bodyHost.firstChild);
      }

      /* ---------- 目录（从正文标题生成，点回默认锚点高亮由 demo.js 接管） ---------- */
      var heads = [].slice.call(bodyHost.querySelectorAll("h2, h3"));
      var toc = $("[data-post-toc]");
      if (heads.length) {
        toc.hidden = false;
        heads.forEach(function (h, idx) {
          if (!h.id) h.id = "sec-" + (idx + 1);
        });
        $("[data-toc-links]").innerHTML = heads.map(function (h) {
          return '<a href="#' + h.id + '"' + (h.tagName === "H3" ? ' class="toc-sub"' : "") + ">" +
            esc(h.textContent) + "</a>";
        }).join("");
      }

      /* ---------- 上下篇（同一面内） ---------- */
      var list = store.published(face);
      var pos = list.map(function (p) { return p.id; }).indexOf(post.id);
      var prev = pos > 0 ? list[pos - 1] : null;
      var next = pos >= 0 && pos < list.length - 1 ? list[pos + 1] : null;
      var href = function (p) {
        return p.detail || ("post.html?face=" + face + "&slug=" + encodeURIComponent(p.slug));
      };
      $("[data-post-nav]").innerHTML =
        (prev ? '<a class="prev" href="' + href(prev) + '"><span>上一篇</span><b>' + esc(prev.title) + "</b></a>" : "<span></span>") +
        (next ? '<a class="next" href="' + href(next) + '"><span>下一篇</span><b>' + esc(next.title) + "</b></a>" : "<span></span>");
    })();
  </script>
</body>
</html>
