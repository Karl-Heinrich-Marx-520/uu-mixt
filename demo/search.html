  <main class="page" id="main">
    <h1 style="font-size:1.5rem;margin:6px 0 10px">全站搜索</h1>
    <p class="search-meta" style="margin-bottom:18px">一次搜索覆盖两面：结果同时来自 UU 与 Mixt，每条标识所属作者。搜索范围是标题、摘要、分类与标签。</p>

    <div class="search-box">

  <script src="assets/demo-store.js?v=5"></script>
  <script src="assets/demo.js?v=5"></script>
  <script>
    /* 全站搜索：纯前端（内容层数据），刻意跨两面，结果标识作者 */
    (function () {
      "use strict";
      var store = window.UUMStore;
      var FACES = {
        uu: { name: "UU", avatar: "assets/uu.jpg" },
        mixt: { name: "Mixt", avatar: "assets/mixt.jpg" }
      };
      var input = document.getElementById("q");
      var meta = document.querySelector("[data-search-meta]");
      var host = document.querySelector("[data-results]");

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function hl(text, q) {
        var safe = esc(text);
        if (!q) return safe;
        var re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
        return safe.replace(re, "<mark>$1</mark>");
      }

      /* 全部已发布文章（两面） */
      var ALL = [];
      Object.keys(FACES).forEach(function (f) {
        store.published(f).forEach(function (p) {
          ALL.push({
            face: f, post: p,
            hay: [p.title, p.desc, p.category, (p.tags || []).join(" ")].join(" ").toLowerCase()
          });
        });
      });

      function search(q) {
        var key = q.trim().toLowerCase();
        if (!key) return [];
        var terms = key.split(/\s+/).filter(Boolean);
        return ALL.filter(function (item) {
          return terms.every(function (t) { return item.hay.indexOf(t) !== -1; });
        }).sort(function (a, b) {
          /* 标题命中优先，其次按日期 */
          var at = a.post.title.toLowerCase().indexOf(key) !== -1 ? 0 : 1;
          var bt = b.post.title.toLowerCase().indexOf(key) !== -1 ? 0 : 1;
          if (at !== bt) return at - bt;
          return (b.post.date || "").localeCompare(a.post.date || "");
        });
      }

      function render(q) {
        var hits = search(q);
        var counts = { uu: 0, mixt: 0 };
        hits.forEach(function (h) { counts[h.face]++; });

        if (!q.trim()) {
          meta.textContent = "输入关键词开始搜索（共收录 " + ALL.length + " 篇文章，两面合计）";
          host.innerHTML = "";
          return;
        }
        meta.textContent = hits.length
          ? "命中 " + hits.length + " 篇：UU " + counts.uu + " 篇 · Mixt " + counts.mixt + " 篇"
          : "没有找到匹配的文章，换个关键词试试";

        host.innerHTML = hits.map(function (h) {
          var p = h.post, f = h.face, m = FACES[f];
          var href = p.detail || ("post.html?face=" + f + "&slug=" + encodeURIComponent(p.slug));
          var tags = (p.tags || []).slice(0, 4).map(function (t) {
            return '<span class="chip">' + esc(t) + "</span>";
          }).join("");
          return '<a class="result-item" data-face="' + f + '" href="' + href + '">' +
            '<div class="result-top">' +
              '<span class="result-author" data-face="' + f + '">' + m.name + "</span>" +
              "<time>" + esc(p.date) + "</time>" +
              (p.category ? "<span>· " + esc(p.category) + "</span>" : "") +
            "</div>" +
            "<h3>" + hl(p.title, q.trim()) + "</h3>" +
            "<p>" + hl(p.desc, q.trim()) + "</p>" +
            (tags ? '<div class="chip-row" style="margin-top:10px">' + tags + "</div>" : "") +
            "</a>";
        }).join("");
      }

      var timer = null;
      input.addEventListener("input", function () {
        var v = input.value;
        clearTimeout(timer);
        timer = setTimeout(function () {
          render(v);
          var url = v.trim() ? "?q=" + encodeURIComponent(v.trim()) : location.pathname;
          try { history.replaceState(null, "", url); } catch (e) {}
        }, 120);
      });

      /* 预填 ?q= */
      var pre = new URLSearchParams(location.search).get("q");
      if (pre) { input.value = pre; }
      render(pre || "");
      input.focus();
    })();
  </script>
</body>
</html>
