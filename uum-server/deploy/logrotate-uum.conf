# UU&Mixt · 服务器日志轮转（2026-10-07 修订）
# · rebuild.log：uum-rebuild.sh 一直追加，未轮转前已涨到 1.6MB
# · uum-mirror.log：每日 4 点的 GitHub 灾备镜像日志（/etc/cron.d/uum-mirror），同样只增不减
# 语义：超过阈值即轮转，各保留 5 份；copytruncate 保证不用重启任何服务（脚本持有的是
#       inode 写句柄，复制后截断原位即可）。
/srv/uum/rebuild.log {
    size 512k
    rotate 5
    missingok
    notifempty
    copytruncate
    su uum uum
}

/var/log/uum-mirror.log {
    size 256k
    rotate 5
    missingok
    notifempty
    copytruncate
    su uum uum
}
