# UU&Mixt · 正式站（443 HTTPS，Let's Encrypt）+ 80 强制跳转 + 8080 IP 预览保留
# 2026-10-06：补安全响应头（X-Content-Type-Options / X-Frame-Options /
#             Referrer-Policy / Permissions-Policy）+ 图片 1 天缓存 + server_tokens off。
#             关键坑：add_header 在 location 内一旦出现会覆盖上级全部 add_header，
#             所以每个自带 add_header 的 location 都必须重复 include 片段文件。

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uuandmixt.com www.uuandmixt.com;

    ssl_certificate     /etc/letsencrypt/live/uuandmixt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uuandmixt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /srv/uum/dist;
    index index.html;

    include snippets/uum-sec.conf;
    include snippets/uum-hsts.conf;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / { try_files $uri $uri/ =404; }

    # ^~ 让 /_astro/ 不再落到下面的图片正则，保住 immutable 一年缓存
    location ^~ /_astro/ {
        include snippets/uum-sec.conf;
        include snippets/uum-hsts.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # 文章配图：文件名不变即覆盖，缓存取 1 天（长缓存会导致换图后访客看不到）
    location ~* \.(png|jpe?g|webp|gif|svg|avif|ico)$ {
        include snippets/uum-sec.conf;
        include snippets/uum-hsts.conf;
        add_header Cache-Control "public, max-age=86400";
    }
    location ~* \.html$ {
        include snippets/uum-sec.conf;
        include snippets/uum-hsts.conf;
        add_header Cache-Control "no-cache";
    }
    location = /search-index.json {
        include snippets/uum-sec.conf;
        include snippets/uum-hsts.conf;
        add_header Cache-Control "public, max-age=300";
    }

    # 写作台写入 API + 桌宠 LLM 转发（uum-server · 127.0.0.1:8787）
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 35s;
        client_max_body_size 3m;
    }
    location ~ /\. { return 404; }

    gzip on;
    gzip_vary on;        # 让中间缓存按 Accept-Encoding 分区
    gzip_proxied any;    # 写作台数据包 188KB：客户端经代理（带 Via）时也要压缩
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# 80：ACME 续期验证保留 + 全部流量强制跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name uuandmixt.com www.uuandmixt.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# 8080：IP 直连预览保留（域名网络异常时的后路）
server {
    listen 8080;
    server_name _;
    root /srv/uum/dist;
    index index.html;

    include snippets/uum-sec.conf;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / { try_files $uri $uri/ =404; }
    location ^~ /_astro/ {
        include snippets/uum-sec.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(png|jpe?g|webp|gif|svg|avif|ico)$ {
        include snippets/uum-sec.conf;
        add_header Cache-Control "public, max-age=86400";
    }
    location ~* \.html$ {
        include snippets/uum-sec.conf;
        add_header Cache-Control "no-cache";
    }
    location = /search-index.json {
        include snippets/uum-sec.conf;
        add_header Cache-Control "public, max-age=300";
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 35s;
        client_max_body_size 3m;
    }
    location ~ /\. { return 404; }

    gzip on;
    gzip_vary on;        # 让中间缓存按 Accept-Encoding 分区
    gzip_proxied any;    # 写作台数据包 188KB：客户端经代理（带 Via）时也要压缩
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
